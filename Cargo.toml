[workspace]
resolver = "3"
members = [
    "crates/oxisport-core",
    "crates/oxisport-runtime",
    "crates/oxisport-files",
    "crates/oxisport-codegen",
    "crates/providers/example/oxisport-example-raw",
    "crates/providers/example/oxisport-example",
    "crates/providers/strava/oxisport-strava-raw",
    "crates/providers/strava/oxisport-strava",
    "crates/providers/intervals/oxisport-intervals-raw",
    "crates/providers/intervals/oxisport-intervals",
    "crates/providers/garmin/oxisport-garmin-raw",
    "crates/providers/garmin/oxisport-garmin",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
futures-util = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["fs"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
url = "2"
wiremock = "0.6"

oxisport-core = { path = "crates/oxisport-core" }
oxisport-runtime = { path = "crates/oxisport-runtime" }
oxisport-codegen = { path = "crates/oxisport-codegen" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.metadata]
